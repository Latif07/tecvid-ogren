name: APK derle

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'android-res/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Push'ta APK yalnızca commit mesajında [apk] varsa derlenir (önce web'de test edilir); elle başlatma her zaman derler
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Uygulama dosyalarını hazırla
        run: |
          mkdir -p proje && cp -r www android-res package.json capacitor.config.json proje/
          ls proje

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || echo "SDK kurulumu atlandı, Gradle kendisi indirecek"

      - name: Android projesini hazırla
        working-directory: proje
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          # Firebase: google-services.json ve Google girişi
          cp android-res/google-services.json android/app/google-services.json
          sed -i "s/^ext {/ext {\n    rgcfaIncludeGoogle = true/" android/variables.gradle
          grep -n rgcfaIncludeGoogle android/variables.gradle
          # Mikrofon izni (kendi okuyuşunu kaydetme)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' android/app/src/main/AndroidManifest.xml
          grep -n RECORD_AUDIO android/app/src/main/AndroidManifest.xml
          # Sesli yönerge (TextToSpeech): Android 11+ paket görünürlüğü için TTS_SERVICE sorgusu
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n TTS_SERVICE android/app/src/main/AndroidManifest.xml
          # Uygulama simgesi
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r android-res/mipmap-* android/app/src/main/res/
          # Bildirim simgesi (günlük hatırlatma)
          mkdir -p android/app/src/main/res/drawable && cp android-res/drawable/*.xml android/app/src/main/res/drawable/
          # Sabit imza anahtarı: güncellemeler eski sürümün üstüne kurulabilsin
          mkdir -p ~/.android && cp android-res/debug.keystore ~/.android/debug.keystore
          # Sürüm numarası
          SURUM=$(node -e "process.stdout.write(require('./www/js/surumler.js').SURUM)")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$SURUM\"/" android/app/build.gradle
          echo "SURUM=$SURUM" >> $GITHUB_ENV
          node -e "const v=require('./www/js/surumler.js');const x=v.LISTE.find(y=>y.s===v.SURUM)||{l:[]};process.stdout.write('Telefona kurmak için aşağıdaki **tecvid-ogren.apk** dosyasına dokun.\nGüncellemeler eskisinin üstüne kurulur, ilerlemen silinmez.\n\n### Yenilikler\n'+x.l.map(m=>'- '+m).join('\n')+'\n')" > ../surum-notu.md

      - name: APK derle
        working-directory: proje/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../../tecvid-ogren.apk

      - name: Releases'a koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.SURUM }}
          name: Hüsn-i Kıraat ${{ env.SURUM }}
          body_path: surum-notu.md
          files: tecvid-ogren.apk
          make_latest: true
