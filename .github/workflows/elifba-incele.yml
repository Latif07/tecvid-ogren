name: Diyanet Elif-Ba inceleme
on: workflow_dispatch
jobs:
  incele:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Sayfa ve ağ istekleri
        run: |
          cat > i.py <<'PY'
          import re, asyncio
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b = await p.chromium.launch(); pg = await b.new_page()
              istek = []
              pg.on('request', lambda r: istek.append(r.url))
              for u in ['https://kuran.diyanet.gov.tr/elifba/', 'http://kuran.diyanet.gov.tr/elifba/']:
                try:
                  await pg.goto(u, wait_until='networkidle', timeout=60000); print('ACILDI', pg.url); break
                except Exception as e: print('HATA', u, e)
              await pg.wait_for_timeout(4000)
              html = await pg.content(); print('BASLIK', await pg.title()); print('HTML_UZUNLUK', len(html))
              print('METIN', (await pg.inner_text('body'))[:3000].replace('\n',' | '))
              for a in await pg.eval_on_selector_all('a', 'l => l.map(x => x.href + " :: " + x.textContent.trim().slice(0,40))'): print('LINK', a)
              for u in sorted(set(istek)): print('ISTEK', u)
              js = [u for u in set(istek) if u.split('?')[0].endswith('.js') and 'diyanet' in u]
              for u in js:
                try:
                  t = await (await pg.request.get(u)).text()
                  for m in sorted(set(re.findall(r"[\"'][^\"'\s]{0,120}\.(?:mp3|ogg|m4a|wav|json)[\"']", t)))[:200]: print('JSDOSYA', u.split('/')[-1], m)
                  for m in sorted(set(re.findall(r"[\"'](?:https?:)?//[^\"'\s]+[\"']", t)))[:100]: print('JSURL', u.split('/')[-1], m)
                except Exception as e: print('JSHATA', u, e)
              await b.close()
          asyncio.run(main())
          PY
          python i.py
