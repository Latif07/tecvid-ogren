name: Diyanet Elif-Ba inceleme
on: workflow_dispatch
jobs:
  incele:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Erişim ve arşiv
        run: |
          for u in https://kuran.diyanet.gov.tr/ https://kuran.diyanet.gov.tr/elifba/ https://webdosya.diyanet.gov.tr/kuran/kuranikerim/Sound/ar_osmanSahin/1_1.mp3; do
            echo "ERISIM $u $(curl -s -m 20 -o /dev/null -w '%{http_code}' "$u" || echo hata)"; done
          echo "== CDX elifba"
          curl -s -m 60 "https://web.archive.org/cdx/search/cdx?url=kuran.diyanet.gov.tr/elifba/*&output=txt&fl=timestamp,original,mimetype,statuscode&collapse=urlkey&limit=3000" > cdx.txt; wc -l cdx.txt
          awk '{print $3}' cdx.txt | sort | uniq -c | sort -rn | head -20 | sed 's/^/MIME /'
          grep -iE "\.(mp3|ogg|m4a|wav)" cdx.txt | head -150 | sed 's/^/SES /'
          grep -iE "\.(js|json)" cdx.txt | head -60 | sed 's/^/JS /'
          grep -viE "\.(mp3|ogg|m4a|wav|js|json|png|jpg|gif|css|svg|woff|ttf)" cdx.txt | head -60 | sed 's/^/SAYFA /'
