name: Diyanet Elif-Ba inceleme
on: workflow_dispatch
jobs:
  incele:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Menü ve yol kurgusu
        run: |
          curl -sL --retry 4 --retry-delay 5 -m 90 "https://web.archive.org/web/20170607031313id_/http://kuran.diyanet.gov.tr/elifba/js/models/MenuModel.js" -o menu.js
          sleep 3; curl -sL --retry 4 --retry-delay 5 -m 90 "https://web.archive.org/web/20181003004348id_/http://kuran.diyanet.gov.tr/elifba/js/ContentManager.js" -o cm.js
          sed 's/^/MENU /' menu.js | head -400
          grep -n -B3 -A12 "blob.core" cm.js | sed 's/^/CM /'
          grep -n -B2 -A6 "data-sound\b\|attr(\"data-sound\|\.mp3" cm.js | head -80 | sed 's/^/CM2 /'
      - name: Azure deposu erişim
        run: |
          B=https://dibwebfiles1we1.blob.core.windows.net/webfiles/kuran.diyanet.gov.tr/elifba/data/sound
          for p in elifba/harfler/harfler/btn_1.mp3 elifba/fetha/fetha/baslik.mp3 elifba/fetha/fetha/btn_1.mp3 elifba/kesra/kesra/btn_1.mp3 elifba/damme/damme/btn_1.mp3; do
            echo "BLOB $p $(curl -s -m 30 -o /dev/null -w '%{http_code} %{size_download}' "$B/$p")"; done
          echo "LISTE $(curl -s -m 30 "https://dibwebfiles1we1.blob.core.windows.net/webfiles?restype=container&comp=list&prefix=kuran.diyanet.gov.tr/elifba/data/sound/elifba/fetha&maxresults=50" | head -c 600)"
