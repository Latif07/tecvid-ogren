name: YouTube mahreç videoları inceleme
on: workflow_dispatch
jobs:
  incele:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          cat > y.py <<'PY'
          import json, re, urllib.request, urllib.parse
          H = {'User-Agent': 'Mozilla/5.0', 'Accept-Language': 'tr-TR,tr;q=0.9'}
          def get(u):
            return urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30).read().decode('utf-8', 'ignore')
          ids = set('y2CGC83DTNU Y-caH_s3hQo 1DZINs1sOOM C1PS8DB-7oQ tpoSFszQu20 9t-27mDzvYE UZRKP0qFA_M PHWdLabLN88 4WClyGtBnQ0'.split())
          for q in ['mahreç tecvid', 'harflerin mahreçleri', 'mahreç dersi', 'mahreçler hafız', 'harflerin çıkış yerleri tecvid', 'boğaz harfleri mahreç', 'peltek harfler mahreç ث ذ ظ']:
            try:
              h = get('https://www.youtube.com/results?search_query=' + urllib.parse.quote(q) + '&hl=tr&gl=TR')
              m = re.search(r'var ytInitialData = (\{.*?\});</script>', h)
              d = json.loads(m.group(1)); n = 0
              def gez(o):
                global n
                if isinstance(o, dict):
                  if 'videoRenderer' in o:
                    v = o['videoRenderer']; vid = v.get('videoId'); ids.add(vid); n += 1
                    t = ''.join(r.get('text','') for r in v.get('title',{}).get('runs',[]))
                    ch = ''.join(r.get('text','') for r in v.get('ownerText',{}).get('runs',[]))
                    ln = v.get('lengthText',{}).get('simpleText',''); vc = v.get('viewCountText',{}).get('simpleText',''); pt = v.get('publishedTimeText',{}).get('simpleText','')
                    print('ARA', q, '|', vid, '|', t, '|', ch, '|', ln, '|', vc, '|', pt)
                  for x in o.values(): gez(x)
                elif isinstance(o, list):
                  for x in o: gez(x)
              gez(d)
            except Exception as e: print('ARAHATA', q, e)
          for vid in sorted(i for i in ids if i):
            try:
              j = json.loads(get('https://www.youtube.com/oembed?format=json&url=https://www.youtube.com/watch?v=' + vid))
              print('GOMME', vid, 'evet', '|', j.get('title'), '|', j.get('author_name'), '|', j.get('author_url'))
            except Exception as e: print('GOMME', vid, 'hayir', e)
          PY
          python3 y.py
