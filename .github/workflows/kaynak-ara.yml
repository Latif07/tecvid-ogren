name: Kaynak araştırma
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - name: Diyanet Kur'an portalı yapısı (yalnız adresler, içerik indirilmez)
        shell: bash
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          for u in https://kuran.diyanet.gov.tr/ https://kuran.diyanet.gov.tr/mushaf https://mobiluygulama.diyanet.gov.tr/ https://elifba.diyanet.gov.tr/ ; do
            code=$(curl -sL -m 30 -A "$UA" -o p.html -w '%{http_code} %{url_effective}' "$u"); echo "== $u -> $code $(stat -c%s p.html)"
            grep -oE '(src|href)="[^"]+\.(js|json)[^"]*"' p.html | head -20
            grep -oE 'https?://[a-zA-Z0-9./_-]*(api|audio|ses|mp3|cdn|media)[a-zA-Z0-9./_-]*' p.html | sort -u | head -20
            grep -oiE '<title>[^<]*' p.html | head -2
          done
          # ana JS paketlerinde API uçları
          curl -sL -m 30 -A "$UA" https://kuran.diyanet.gov.tr/mushaf -o m.html
          for js in $(grep -oE 'src="[^"]+\.js[^"]*"' m.html | sed 's/src="//;s/"$//' | head -12); do
            case "$js" in http*) url="$js";; /*) url="https://kuran.diyanet.gov.tr$js";; *) url="https://kuran.diyanet.gov.tr/$js";; esac
            curl -sL -m 30 -A "$UA" "$url" -o b.js; echo "-- $url $(stat -c%s b.js)"
            grep -oE '"(https?:)?//[^"]{4,120}"|`(https?:)?//[^`]{4,120}`' b.js | grep -iE 'api|audio|ses|mp3|sound|cdn|meal|mushaf|sure|ayet' | sort -u | head -25
            grep -oE '"/api/[^"]{2,80}"|/api/[a-zA-Z/{}]{2,60}' b.js | sort -u | head -25
          done
