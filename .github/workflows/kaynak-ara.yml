name: Ses kaynağı ara (Commons)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - name: Wikimedia Commons sorgusu
        shell: python
        run: |
          import json, time, urllib.request, urllib.parse
          A = 'https://commons.wikimedia.org/w/api.php'
          def q(**p):
              p.update(format='json'); u = A + '?' + urllib.parse.urlencode(p)
              for d in (2, 6, 15):
                  try:
                      r = urllib.request.Request(u, headers={'User-Agent': 'tecvid-ogren-arastirma/1.0 (github.com/Latif07/tecvid-ogren)'})
                      x = json.load(urllib.request.urlopen(r, timeout=30)); time.sleep(1.5); return x
                  except Exception as e: print('  tekrar', e); time.sleep(d)
              return {}
          def bilgi(titles):
              d = q(action='query', titles='|'.join(titles), prop='imageinfo', iiprop='extmetadata|size|url|mediatype')
              for pg in d.get('query', {}).get('pages', {}).values():
                  ii = (pg.get('imageinfo') or [{}])[0]; m = ii.get('extmetadata', {})
                  g = lambda k: (m.get(k, {}).get('value') or '')[:160].replace('\n', ' ')
                  print(f"- {pg['title']} | lisans: {g('LicenseShortName')} | yazar: {g('Artist')} | süre: {ii.get('duration')} | {g('ImageDescription')[:140]} | {ii.get('url')}")
          print('== Escuela Internacional de Árabe serisi')
          d = q(action='query', list='search', srsearch='intitle:"Escuela Internacional de Árabe" filetype:audio', srnamespace=6, srlimit=100)
          l = [x['title'] for x in d.get('query', {}).get('search', [])]; print(len(l), 'dosya'); 
          for i in range(0, len(l), 40): bilgi(l[i:i + 40])
          print('== Tek dosyada alfabe ve diğer adaylar')
          bilgi(['File:حروف الأبجدية العربية Arabic alphabet.ogg', 'File:Arabic alphabet (31s, 80kbps).ogg', 'File:Arabic alphabets.ogg', 'File:Arabic خ.wav', 'File:Voiced pharyngeal fricative "ع".wav', 'File:NL-Arabisch Alfabet-article.ogg'])
          print('== Category:Arabic alphabet içindeki ses dosyaları')
          d = q(action='query', list='categorymembers', cmtitle='Category:Arabic alphabet', cmtype='file', cmlimit=200)
          print([x['title'] for x in d.get('query', {}).get('categorymembers', []) if x['title'].lower().endswith(('.ogg', '.oga', '.wav', '.mp3', '.opus', '.flac'))])
