name: Kaynak araştırma
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - name: Diyanet ses dosyalarına erişim (yalnız başlıklar)
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          for k in ar_osmanSahin ar_mehmetcevik ar_cuheyni; do for a in 1_1 1_7 112_1 2_255; do
            for base in https://webdosya.diyanet.gov.tr/kuran/kuranikerim/Sound https://kuran.diyanet.gov.tr/api/audio/kuran/kuranikerim/Sound; do
              echo "-- $base/$k/$a.mp3"; curl -sI -m 30 -A "$UA" -H 'Origin: https://latif07.github.io' "$base/$k/$a.mp3" | grep -iE '^(HTTP|content-type|content-length|access-control-allow-origin)'
            done; done; done
          echo "== font"; curl -sI -m 30 -A "$UA" -H 'Origin: https://latif07.github.io' https://webdosya.diyanet.gov.tr/kuran/kuranikerim/dosyalar/font/KuranKerimFontHamdullah.ttf | grep -iE '^(HTTP|content-type|content-length|access-control-allow-origin)'
