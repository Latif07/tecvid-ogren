name: Kaynak araştırma
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - name: Diyanet portalı uç adları (içerik yazdırılmaz)
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          H=(-A "$UA" -H 'Referer: https://kuran.diyanet.gov.tr/kuran' --retry 3 -m 60 -sL)
          echo "pagedata: $(curl "${H[@]}" -o pd.json -w '%{http_code}' 'https://kuran.diyanet.gov.tr/mushaf/qurandm/pagedata?id=1') $(stat -c%s pd.json) bayt"
          python3 -c "import json;d=json.load(open('pd.json'));print('anahtarlar:', list(d.keys())[:20] if isinstance(d,dict) else type(d))" 2>&1 | head -3
          curl "${H[@]}" https://kuran.diyanet.gov.tr/ -o m.html
          js=$(grep -oE '/assets/index-[^"]+\.js' m.html | head -1)
          echo "ana js: $js $(curl "${H[@]}" -o b.js -w '%{http_code}' "https://kuran.diyanet.gov.tr$js") $(stat -c%s b.js)"
          grep -oE '/assets/[A-Za-z0-9_.-]+\.js' b.js | sort -u > alt.txt; echo "alt parça: $(wc -l < alt.txt)"
          cat b.js > hepsi.js
          for p in $(cat alt.txt); do curl "${H[@]}" "https://kuran.diyanet.gov.tr$p" >> hepsi.js; echo >> hepsi.js; done
          echo "toplam js: $(stat -c%s hepsi.js)"
          echo "== uç adları"
          grep -oE '["`/](mushaf|qurandm|api|meal|tefsir|audio|ses|mp3|kari|okuyucu|reciter|hafiz|webdosya)[^"`<> ]{0,100}' hepsi.js | sort -u | head -120
          echo "== tam adresler"
          grep -oE 'https?://[A-Za-z0-9._/-]*diyanet[A-Za-z0-9._/?=&{}$-]*' hepsi.js | sort -u | head -60
