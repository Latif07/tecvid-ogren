name: Web sürümü (iPhone)

on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Duman testi (başarısız olursa yayın yapılmaz)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.0
          npx playwright install --with-deps chromium
          node tools/test/smoke.js
      - name: Sürüm numarasını yaz (önbellek yenilensin)
        run: |
          sed -i "s/SURUM_YER/${{ github.run_number }}-${GITHUB_SHA::7}/" www/sw.js
          sed -i "s/YAYIN_YER/#${{ github.run_number }}/" www/js/surumler.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - id: dagit
        uses: actions/deploy-pages@v4
