<body>
  <div id="app"></div>
  <script>
    // PWA: Chrome "yüklenebilir" sinyalini sayfa açılır açılmaz verebilir; uygulama yüklenmeden yakalanır, düğmeyle gösterilir
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__yukleIstegi = e; window.dispatchEvent(new Event('yuklenebilir')); });
    window.addEventListener('appinstalled', function () { window.__yukleIstegi = null; window.__yuklendi = true; window.dispatchEvent(new Event('yuklenebilir')); });
  </script>
  <script src="js/capacitor.js"></script>

  <script src="js/content.js"></script>
  <script>
    // İngilizce içerik yalnız İngilizcede yüklenir (Türkçe açılışı hafifletir)
    if (window.DIL === 'en') document.write('<script src="js/content-en.js"><\/script>');
  </script>
  <script src="js/ayahs.js"></script>

  <script>
    // Hesap ve bulut (Firebase, ~900 KB) ilk açılışı yavaşlatmasın: daha önce giriş yapıldıysa hemen,
    // yoksa uygulama açıldıktan sonra arka planda ya da Hesap/Sınıf ekranı açılınca yüklenir.
    (function () {
      function yukle() { if (window.__bulutYukleniyor) return; window.__bulutYukleniyor = true; var s = document.createElement('script'); s.type = 'module'; s.src = 'js/bulut.js'; document.body.appendChild(s); }
      window.bulutYukle = yukle;
      var girisli = false; try { girisli = localStorage.getItem('tecvid-ogren.bulut') === '1'; } catch (e) { }
      if (girisli) yukle(); else window.addEventListener('load', function () { setTimeout(yukle, 4000); });
    })();
  </script>
  <script>
    // Web sürümü (iPhone / tarayıcı): çevrimdışı çalışsın diye service worker. Android uygulamasında gerekmez.
    if ('serviceWorker' in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) && location.protocol === 'https:')
      navigator.serviceWorker.register('sw.js').catch(function () {});
  </script>
</body>
